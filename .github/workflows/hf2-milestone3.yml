name: HF2 Milestone 3 - native geometry reasoning

on:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'src/noeron/conversation_premises.py'
      - 'src/noeron/conversation_bridge.py'
      - 'src/noeron/conversation_reasoning.py'
      - 'tests/test_v082_hf2_native_geometry_trace.py'
      - 'tests/test_v082_hf2_conversation_reasoning.py'
      - '.github/workflows/hf2-milestone3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-geometry-reasoning-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engineering carrier
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install narrow test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile milestone source
        run: |
          python -m compileall -q \
            src/noeron/conversation_premises.py \
            src/noeron/conversation_bridge.py \
            src/noeron/conversation_reasoning.py

      - name: Run native geometry trace and bounded selection tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_v082_hf2_native_geometry_trace.py \
            tests/test_v082_hf2_conversation_reasoning.py

      - name: Native machinery and authority source scan
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'dkt_support_knot' src/noeron/conversation_premises.py
          grep -q 'core_knot' src/noeron/conversation_bridge.py
          grep -q 'runtime-injected-native-DKT-Hs-distance-only' src/noeron/conversation_reasoning.py
          grep -q 'exact_tie_at_cutoff' src/noeron/conversation_reasoning.py
          grep -q 'semantic_truth_authority.*False' src/noeron/conversation_reasoning.py
          grep -q 'answer_authority.*False' src/noeron/conversation_reasoning.py
          echo 'native_geometry_reasoning_scan=PASS'
