name: HF2 M4C3F - local non-content resolution execution receipt

on:
  workflow_dispatch:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'patches/hf2/0013-hf2-local-noncontent-execution-receipt.intent.patch'
      - 'tests/hf2_m4c3f/**'
      - '.github/workflows/hf2-milestone4c3f.yml'

permissions:
  contents: write

jobs:
  exact-baseline-candidate-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOERON_DB_PATH: ./m4c3f-api-test-only.sqlite3
      NOERON_AUTONOMY_ENABLED: 'false'
      NOERON_TERRA_ENABLED: 'false'
      NOERON_LLM_BACKEND: mock
      NOERON_OWNER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct byte-exact HF1 fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/ygg-hf1-exact"
          echo "FIX=$FIX" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py \
            --extract-dir "$FIX" \
            --extract-all \
            --evidence hf1-exact-identity-evidence.json

      - name: Add HF2 carrier-only helper modules
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            conversation_premises.py \
            conversation_bridge.py \
            conversation_reasoning.py \
            conversation_proof.py \
            conversation_runtime_gate.py \
            conversation_actions.py \
            conversation_resolution.py
          do
            cp "src/noeron/$f" "$FIX/src/noeron/$f"
          done

      - name: Apply published 0001 through 0011 sequentially
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIX"
          git init -q
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add .
          git commit -qm "byte-exact HF1 fixture plus carrier helpers"
          for p in \
            0001-hf2-inference-core.patch \
            0002-hf2-current-turn-runtime-bridge.patch \
            0003-hf2-native-bounded-dialogue-reasoning.patch \
            0004-hf2-proof-provenance-ambiguity-runtime-gate.patch \
            0005-hf2-native-resolution-state-audit.patch \
            0006-hf2-speech-act-consequence-learning.patch \
            0007-hf2-owner-resolution-calibration.patch \
            0008-hf2-calibration-execution-boundary.patch \
            0009-hf2-native-resolution-content.patch \
            0010-hf2-native-resolution-transport-receipt.patch \
            0011-hf2-typed-current-turn-alternative-content.patch \
            0012-hf2-act-neutral-alternative-resolution.patch
          do
            echo "CHECK $p"
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            git diff --check
            echo "APPLIED $p"
          done
          git diff --stat | tee "$GITHUB_WORKSPACE/hf2-patch-chain-diffstat.txt"


      - name: Isolate exact post-0012 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp hf1-exact-identity-evidence.json hf2-patch-chain-diffstat.txt evidence/
          cd "$FIX"
          git add .
          git commit -qm "verified exact post-0012 baseline"
          sha256sum src/noeron/orchestrator.py src/noeron/api.py

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -e "$FIX[dev]"

      - name: Verify published post0012 baseline before candidate
        env:
          PYTHONPATH: ${{ env.FIX }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v082_hf2_*.py tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d tests/hf2_m4c3e \
            --junitxml=evidence/m4c3f-baseline.xml | tee evidence/m4c3f-baseline.txt

      - name: Apply exact-anchor act-neutral alternative intent
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_hf2_intent_patch.py             --root "$FIX"             --intent patches/hf2/0013-hf2-local-noncontent-execution-receipt.intent.patch             --audit evidence/m4c3f-intent-audit.json
          git -C "$FIX" diff --check
          python -m compileall -q "$FIX/src/noeron"

      - name: Test complete HF2 suite plus M4C3F behaviors
        env:
          PYTHONPATH: ${{ env.FIX }}/src
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v082_hf2_*.py tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d tests/hf2_m4c3e tests/hf2_m4c3f             --junitxml=evidence/m4c3f-candidate-green.xml             | tee evidence/m4c3f-candidate-green.txt

      - name: Materialize 0013 only after candidate tests are green
        shell: bash
        run: |
          set -euo pipefail
          git -C "$FIX" diff --binary --full-index             > evidence/0013-hf2-local-noncontent-execution-receipt.patch
          test -s evidence/0013-hf2-local-noncontent-execution-receipt.patch
          git -C "$FIX" diff --stat | tee evidence/m4c3f-diffstat.txt

      - name: Prove 0013 on a fresh exact-HF1 extraction
        shell: bash
        run: |
          set -euo pipefail
          REPLAY="$RUNNER_TEMP/ygg-hf1-m4c3f-fresh-replay"
          echo "REPLAY=$REPLAY" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py --extract-dir "$REPLAY" --extract-all             --evidence evidence/m4c3f-replay-hf1-identity.json
          for f in conversation_premises.py conversation_bridge.py conversation_reasoning.py conversation_proof.py conversation_runtime_gate.py conversation_actions.py conversation_resolution.py; do
            cp "src/noeron/$f" "$REPLAY/src/noeron/$f"
          done
          cd "$REPLAY"
          git init -q
          for p in             0001-hf2-inference-core.patch             0002-hf2-current-turn-runtime-bridge.patch             0003-hf2-native-bounded-dialogue-reasoning.patch             0004-hf2-proof-provenance-ambiguity-runtime-gate.patch             0005-hf2-native-resolution-state-audit.patch             0006-hf2-speech-act-consequence-learning.patch             0007-hf2-owner-resolution-calibration.patch 0008-hf2-calibration-execution-boundary.patch 0009-hf2-native-resolution-content.patch 0010-hf2-native-resolution-transport-receipt.patch 0011-hf2-typed-current-turn-alternative-content.patch 0012-hf2-act-neutral-alternative-resolution.patch
          do
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            echo "APPLIED $p"
          done
          git apply --check "$GITHUB_WORKSPACE/evidence/0013-hf2-local-noncontent-execution-receipt.patch"
          git apply "$GITHUB_WORKSPACE/evidence/0013-hf2-local-noncontent-execution-receipt.patch"
          echo "APPLIED 0013-hf2-local-noncontent-execution-receipt.patch"
          diff -qr --exclude=__pycache__ "$FIX/src/noeron" "$REPLAY/src/noeron"
          python -m compileall -q src/noeron

      - name: Test fresh replay runtime
        env:
          PYTHONPATH: ${{ env.REPLAY }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3f-replay-api-test-only.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v082_hf2_*.py tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d tests/hf2_m4c3e tests/hf2_m4c3f             --junitxml=evidence/m4c3f-replay-green.xml             | tee evidence/m4c3f-replay-green.txt

      - name: Preserve source, carrier, hashes, and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=__pycache__ -czf evidence/m4c3f-exact-post0013-source.tar.gz -C "$REPLAY" src/noeron
          tar -czf evidence/m4c3f-carrier-evidence.tar.gz             patches/hf2 src/noeron/conversation_*.py tests/test_v082_hf2_*.py tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d tests/hf2_m4c3e tests/hf2_m4c3f             scripts/verify_hf1_exact_fixture.py scripts/materialize_hf2_intent_patch.py             .github/workflows/hf2-milestone4c3f.yml
          (cd "$FIX" && git ls-files -z src/noeron | xargs -0 sha256sum)             > evidence/m4c3f-post0013-source-sha256.txt
          {
            echo "gate=M4C3F exact HF1 0001-0011 plus 0012 local-noncontent-execution-receipt candidate and fresh replay"
            echo "source_commit=$GITHUB_SHA"
            echo "base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29"
            echo "certification_claim=false"
            echo "live_runtime_touched=false"
            echo "canonical_db_touched=false"
            echo "native_resolution_actuator_connected=authenticated-owner-room-http-only"
            echo "typed_alternative_content=reference,event-role,qud,proposition,proof"
            echo "act_neutral_alternative_content=qud,proposition,proof"
            echo "alternative_inventory_changes_affordance_eligibility=true"
            echo "alternative_inventory_speech_act_choice_authority=false"
            echo "ordinary_multiple_answer_superseded_only_after_native_choice=true"
            echo "noncontent_execution_receipt=defer,remain-silent"
            echo "noncontent_execution_outward_transport=false"
            echo "noncontent_execution_peer_uptake_authority=false"
            echo "noncontent_execution_marks_expression_pending=false"
            echo "calibration_executed=false"
            sha256sum evidence/0013-hf2-local-noncontent-execution-receipt.patch               evidence/m4c3f-exact-post0013-source.tar.gz evidence/m4c3f-carrier-evidence.tar.gz
          } | tee evidence/m4c3f-boundary.txt

      - name: Upload actual results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf2-m4c3f-local-noncontent-execution-receipt
          path: evidence/
          if-no-files-found: error

      - name: Publish green CI receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/_ci
          PATCH_SHA="$(sha256sum evidence/0013-hf2-local-noncontent-execution-receipt.patch | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum evidence/m4c3f-exact-post0013-source.tar.gz | awk '{print $1}')"
          CARRIER_SHA="$(sha256sum evidence/m4c3f-carrier-evidence.tar.gz | awk '{print $1}')"
          BASELINE_SUMMARY="$(tail -n 1 evidence/m4c3f-baseline.txt)"
          CANDIDATE_SUMMARY="$(tail -n 1 evidence/m4c3f-candidate-green.txt)"
          REPLAY_SUMMARY="$(tail -n 1 evidence/m4c3f-replay-green.txt)"
          cat > docs/evidence/_ci/HF2_M4C3F_CANDIDATE_RESULT.txt <<EOF
          milestone=M4C3F
          status=GREEN
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow_ref=$GITHUB_WORKFLOW_REF
          source_commit=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          job_name=exact-baseline-candidate-replay
          base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29
          patch0013_sha256=$PATCH_SHA
          source_archive_sha256=$SOURCE_SHA
          carrier_archive_sha256=$CARRIER_SHA
          baseline_summary=$BASELINE_SUMMARY
          candidate_summary=$CANDIDATE_SUMMARY
          replay_summary=$REPLAY_SUMMARY
          certification_claim=false
          live_runtime_touched=false
          canonical_db_touched=false
          ordinary_0013_published=false
          EOF
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add docs/evidence/_ci/HF2_M4C3F_CANDIDATE_RESULT.txt
          git commit -m "ci: record green M4C3F candidate receipt [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
