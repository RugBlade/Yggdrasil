name: HF2 Milestone 3D - runtime proof gate carrier

on:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'src/noeron/conversation_proof.py'
      - 'src/noeron/conversation_runtime_gate.py'
      - 'patches/hf2/0004-hf2-proof-provenance-ambiguity-runtime-gate.patch'
      - 'tests/test_v082_hf2_runtime_proof_gate.py'
      - 'tests/test_v082_hf2_proof_runtime_patch_contract.py'
      - '.github/workflows/hf2-milestone3d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile carrier gate
        run: |
          python -m compileall -q \
            src/noeron/conversation_premises.py \
            src/noeron/conversation_proof.py \
            src/noeron/conversation_runtime_gate.py
      - name: Run runtime gate and patch-contract tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_v082_hf2_runtime_proof_gate.py \
            tests/test_v082_hf2_proof_runtime_patch_contract.py
      - name: Authority/nonranking source scan
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'never ranks' src/noeron/conversation_runtime_gate.py
          grep -q 'candidate_ranking.*False' src/noeron/conversation_runtime_gate.py
          grep -q 'why-proposition' src/noeron/conversation_runtime_gate.py
          grep -q 'block_unscoped_ambiguity' src/noeron/conversation_runtime_gate.py
          grep -q 'proof-gated-missing-why-target' src/noeron/conversation_runtime_gate.py
          grep -q '"answer": False' src/noeron/conversation_runtime_gate.py
          grep -q 'current_language_structure=current_structure' patches/hf2/0004-hf2-proof-provenance-ambiguity-runtime-gate.patch
          grep -q 'block_unscoped_ambiguity=True' patches/hf2/0004-hf2-proof-provenance-ambiguity-runtime-gate.patch
          echo 'runtime_proof_gate_scan=PASS'
