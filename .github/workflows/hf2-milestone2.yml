name: HF2 Milestone 2 - bounded conversation premises

on:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'src/noeron/conversation_premises.py'
      - 'tests/test_v082_hf2_conversation_premises.py'
      - '.github/workflows/hf2-milestone2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-premise-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout engineering carrier
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install narrow test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile milestone source
        run: python -m compileall -q src/noeron/conversation_premises.py

      - name: Run bounded premise tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_v082_hf2_conversation_premises.py

      - name: Authority-boundary source scan
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bounded_dialogue_is_cognitive_memory.*False' src/noeron/conversation_premises.py
          grep -q 'serialization_grants_truth.*False' src/noeron/conversation_premises.py
          grep -q 'IRG->DKT->regional-EGR->RL/Frenet->DKT->native-cognition/action' src/noeron/conversation_premises.py
          echo 'authority_boundary_scan=PASS'
