name: HF2 M4C3M - client media retry restart candidate

on:
  workflow_dispatch:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'patches/hf2/0018-hf2-client-media-network-retry.intent.patch'
      - 'tests/hf2_m4c3m/**'
      - '.github/workflows/hf2-milestone4c3m.yml'

permissions:
  contents: write

jobs:
  exact-baseline-candidate-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOERON_DB_PATH: ./m4c3m-api-test-only.sqlite3
      NOERON_AUTONOMY_ENABLED: 'false'
      NOERON_TERRA_ENABLED: 'false'
      NOERON_LLM_BACKEND: mock
      NOERON_OWNER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct byte-exact HF1 fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/ygg-hf1-exact"
          echo "FIX=$FIX" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py --extract-dir "$FIX" --extract-all --evidence hf1-exact-identity-evidence.json

      - name: Add HF2 carrier-only helper modules
        shell: bash
        run: |
          set -euo pipefail
          for f in conversation_premises.py conversation_bridge.py conversation_reasoning.py conversation_proof.py conversation_runtime_gate.py conversation_actions.py conversation_resolution.py; do
            cp "src/noeron/$f" "$FIX/src/noeron/$f"
          done

      - name: Apply published 0001 through 0017 sequentially
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIX"
          git init -q
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add .
          git commit -qm "byte-exact HF1 fixture plus carrier helpers"
          for p in             0001-hf2-inference-core.patch             0002-hf2-current-turn-runtime-bridge.patch             0003-hf2-native-bounded-dialogue-reasoning.patch             0004-hf2-proof-provenance-ambiguity-runtime-gate.patch             0005-hf2-native-resolution-state-audit.patch             0006-hf2-speech-act-consequence-learning.patch             0007-hf2-owner-resolution-calibration.patch             0008-hf2-calibration-execution-boundary.patch             0009-hf2-native-resolution-content.patch             0010-hf2-native-resolution-transport-receipt.patch             0011-hf2-typed-current-turn-alternative-content.patch             0012-hf2-act-neutral-alternative-resolution.patch             0013-hf2-local-noncontent-execution-receipt.patch             0014-hf2-same-db-restart-recovery.patch             0015-hf2-native-audio-transport-receipt.patch             0016-hf2-resolution-native-audio-presentation.patch             0017-hf2-authenticated-client-playback-telemetry.patch
          do
            echo "CHECK $p"
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            git diff --check
            echo "APPLIED $p"
          done
          git add .
          git commit -qm "verified exact post0017 runtime"

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -e "$FIX[dev]"

      - name: Verify published post0017 baseline
        env:
          PYTHONPATH: ${{ env.FIX }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3m-baseline.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pytest -q             tests/test_v082_hf2_*.py             tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d             tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h             tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k tests/hf2_m4c3l             --junitxml=evidence/m4c3m-baseline.xml | tee evidence/m4c3m-baseline.txt

      - name: Verify and apply exact 0018 intent candidate
        shell: bash
        run: |
          set -euo pipefail
          INTENT="$GITHUB_WORKSPACE/patches/hf2/0018-hf2-client-media-network-retry.intent.patch"
          GOT="$(sha256sum "$INTENT" | awk '{print $1}')"
          test "$GOT" = "fe9dfe42c9fb2bbf22484f07742a2c9c72d01643d3b77f306fdf9de18a09489a"
          cd "$FIX"
          git apply --check "$INTENT"
          git apply "$INTENT"
          git diff --check
          git diff --stat | tee "$GITHUB_WORKSPACE/evidence/m4c3m-candidate-diffstat.txt"
          python -m compileall -q src/noeron
          echo "patch_sha256=$GOT" | tee "$GITHUB_WORKSPACE/evidence/m4c3m-intent-sha256.txt"

      - name: Run focused M4C3M candidate tests
        env:
          PYTHONPATH: ${{ env.FIX }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3m-focused.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/hf2_m4c3m --junitxml=evidence/m4c3m-focused.xml | tee evidence/m4c3m-focused.txt

      - name: Run complete HF2 suite plus M4C3M candidate
        env:
          PYTHONPATH: ${{ env.FIX }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3m-complete.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_v082_hf2_*.py             tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d             tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h             tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k tests/hf2_m4c3l tests/hf2_m4c3m             --junitxml=evidence/m4c3m-complete.xml | tee evidence/m4c3m-complete.txt

      - name: Preserve generated 0018 candidate only after green primary candidate
        shell: bash
        run: |
          set -euo pipefail
          cp patches/hf2/0018-hf2-client-media-network-retry.intent.patch evidence/0018-hf2-client-media-network-retry.generated.patch
          sha256sum evidence/0018-hf2-client-media-network-retry.generated.patch | tee evidence/m4c3m-generated-patch-sha256.txt

      - name: Reconstruct separate fresh exact-HF1 replay
        shell: bash
        run: |
          set -euo pipefail
          REPLAY="$RUNNER_TEMP/ygg-hf1-m4c3m-fresh-replay"
          echo "REPLAY=$REPLAY" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py --extract-dir "$REPLAY" --extract-all --evidence evidence/m4c3m-replay-hf1-identity.json
          for f in conversation_premises.py conversation_bridge.py conversation_reasoning.py conversation_proof.py conversation_runtime_gate.py conversation_actions.py conversation_resolution.py; do
            cp "src/noeron/$f" "$REPLAY/src/noeron/$f"
          done
          cd "$REPLAY"
          git init -q
          for p in             0001-hf2-inference-core.patch             0002-hf2-current-turn-runtime-bridge.patch             0003-hf2-native-bounded-dialogue-reasoning.patch             0004-hf2-proof-provenance-ambiguity-runtime-gate.patch             0005-hf2-native-resolution-state-audit.patch             0006-hf2-speech-act-consequence-learning.patch             0007-hf2-owner-resolution-calibration.patch             0008-hf2-calibration-execution-boundary.patch             0009-hf2-native-resolution-content.patch             0010-hf2-native-resolution-transport-receipt.patch             0011-hf2-typed-current-turn-alternative-content.patch             0012-hf2-act-neutral-alternative-resolution.patch             0013-hf2-local-noncontent-execution-receipt.patch             0014-hf2-same-db-restart-recovery.patch             0015-hf2-native-audio-transport-receipt.patch             0016-hf2-resolution-native-audio-presentation.patch             0017-hf2-authenticated-client-playback-telemetry.patch
          do
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
          done
          git apply --check "$GITHUB_WORKSPACE/patches/hf2/0018-hf2-client-media-network-retry.intent.patch"
          git apply "$GITHUB_WORKSPACE/patches/hf2/0018-hf2-client-media-network-retry.intent.patch"
          git diff --check
          python -m compileall -q src/noeron
          diff -qr --exclude=__pycache__ "$FIX/src/noeron" "$REPLAY/src/noeron"

      - name: Run focused and complete M4C3M suites on fresh replay
        env:
          PYTHONPATH: ${{ env.REPLAY }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3m-replay.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/hf2_m4c3m --junitxml=evidence/m4c3m-replay-focused.xml | tee evidence/m4c3m-replay-focused.txt
          python -m pytest -q             tests/test_v082_hf2_*.py             tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d             tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h             tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k tests/hf2_m4c3l tests/hf2_m4c3m             --junitxml=evidence/m4c3m-replay-complete.xml | tee evidence/m4c3m-replay-complete.txt

      - name: Preserve source, carrier, hashes and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=__pycache__ -czf evidence/m4c3m-exact-post0018-candidate-source.tar.gz -C "$REPLAY" src/noeron
          tar -czf evidence/m4c3m-carrier-evidence.tar.gz             patches/hf2 src/noeron/conversation_*.py tests/test_v082_hf2_*.py             tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d             tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h             tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k tests/hf2_m4c3l tests/hf2_m4c3m             scripts/verify_hf1_exact_fixture.py .github/workflows/hf2-milestone4c3m.yml             docs/continuation/CONTINUATION_STAGE8B_HF2_M4C3M_DESIGN_20260918.txt             docs/continuation/CONTINUATION_STAGE8B_HF2_M4C3M_CANDIDATE_20260918.txt
          (cd "$FIX" && find src/noeron -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum) > evidence/m4c3m-candidate-source-sha256.txt
          (cd "$REPLAY" && find src/noeron -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum) > evidence/m4c3m-replay-source-sha256.txt
          diff -u evidence/m4c3m-candidate-source-sha256.txt evidence/m4c3m-replay-source-sha256.txt
          {
            echo "gate=M4C3M client media network uncertainty retry candidate"
            echo "source_commit=$GITHUB_SHA"
            echo "base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29"
            echo "published_patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014,0015,0016,0017"
            echo "candidate_patch_sha256=fe9dfe42c9fb2bbf22484f07742a2c9c72d01643d3b77f306fdf9de18a09489a"
            echo "ordinary_0018_published=false"
            echo "client_network_uncertainty_retry=true"
            echo "same_playback_identity_reused=true"
            echo "explicit_non409_http_retry=false"
            echo "autoplay_added=false"
            echo "client_media_event_trains_speech_act=false"
            echo "audible_output_confirmed=false"
            echo "peer_delivery_confirmed=false"
            echo "peer_heard_confirmed=false"
            echo "peer_understanding_confirmed=false"
            echo "peer_reply_causation_confirmed=false"
            echo "client_event_native_choice_authority=false"
            echo "client_event_preference_authority=false"
            echo "client_event_relationship_authority=false"
            echo "client_event_cognitive_memory_authority=false"
            echo "certification_claim=false"
            echo "live_runtime_touched=false"
            echo "canonical_db_touched=false"
            sha256sum evidence/m4c3m-exact-post0018-candidate-source.tar.gz evidence/m4c3m-carrier-evidence.tar.gz
          } | tee evidence/m4c3m-boundary.txt

      - name: Upload M4C3M candidate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf2-m4c3m-client-media-network-retry
          path: evidence/
          if-no-files-found: error

      - name: Publish green M4C3M candidate receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/_ci
          PATCH_SHA="$(sha256sum evidence/0018-hf2-client-media-network-retry.generated.patch | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum evidence/m4c3m-exact-post0018-candidate-source.tar.gz | awk '{print $1}')"
          CARRIER_SHA="$(sha256sum evidence/m4c3m-carrier-evidence.tar.gz | awk '{print $1}')"
          BASELINE_SUMMARY="$(tail -n 1 evidence/m4c3m-baseline.txt)"
          FOCUSED_SUMMARY="$(tail -n 1 evidence/m4c3m-focused.txt)"
          COMPLETE_SUMMARY="$(tail -n 1 evidence/m4c3m-complete.txt)"
          REPLAY_FOCUSED_SUMMARY="$(tail -n 1 evidence/m4c3m-replay-focused.txt)"
          REPLAY_COMPLETE_SUMMARY="$(tail -n 1 evidence/m4c3m-replay-complete.txt)"
          cat > docs/evidence/_ci/HF2_M4C3M_CANDIDATE_RESULT.txt <<EOF
          milestone=M4C3M
          status=GREEN
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow_ref=$GITHUB_WORKFLOW_REF
          source_commit=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          job_name=exact-baseline-candidate-replay
          base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29
          published_patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014,0015,0016,0017
          patch0018_sha256=$PATCH_SHA
          source_archive_sha256=$SOURCE_SHA
          carrier_archive_sha256=$CARRIER_SHA
          baseline_summary=$BASELINE_SUMMARY
          focused_summary=$FOCUSED_SUMMARY
          candidate_summary=$COMPLETE_SUMMARY
          replay_focused_summary=$REPLAY_FOCUSED_SUMMARY
          replay_summary=$REPLAY_COMPLETE_SUMMARY
          source_byte_parity=true
          client_network_uncertainty_retry=true
          same_playback_identity_reused=true
          autoplay_added=false
          client_media_event_trains_speech_act=false
          audible_output_confirmed=false
          peer_delivery_confirmed=false
          peer_heard_confirmed=false
          peer_understanding_confirmed=false
          peer_reply_causation_confirmed=false
          certification_claim=false
          live_runtime_touched=false
          canonical_db_touched=false
          ordinary_0018_published=false
          EOF
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add docs/evidence/_ci/HF2_M4C3M_CANDIDATE_RESULT.txt
          git commit -m "ci: record green M4C3M candidate receipt [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
