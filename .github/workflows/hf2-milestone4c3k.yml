name: HF2 M4C3K - post-receipt presentation crash verification

on:
  workflow_dispatch:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'tests/hf2_m4c3k/**'
      - '.github/workflows/hf2-milestone4c3k.yml'

permissions:
  contents: write

jobs:
  exact-baseline-verification-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NOERON_DB_PATH: ./m4c3k-api-test-only.sqlite3
      NOERON_AUTONOMY_ENABLED: 'false'
      NOERON_TERRA_ENABLED: 'false'
      NOERON_LLM_BACKEND: mock
      NOERON_OWNER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct byte-exact HF1 fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/ygg-hf1-exact"
          echo "FIX=$FIX" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py \
            --extract-dir "$FIX" \
            --extract-all \
            --evidence hf1-exact-identity-evidence.json

      - name: Add HF2 carrier-only helper modules
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            conversation_premises.py \
            conversation_bridge.py \
            conversation_reasoning.py \
            conversation_proof.py \
            conversation_runtime_gate.py \
            conversation_actions.py \
            conversation_resolution.py
          do
            cp "src/noeron/$f" "$FIX/src/noeron/$f"
          done

      - name: Apply published 0001 through 0016 sequentially
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIX"
          git init -q
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add .
          git commit -qm "byte-exact HF1 fixture plus carrier helpers"
          for p in \
            0001-hf2-inference-core.patch \
            0002-hf2-current-turn-runtime-bridge.patch \
            0003-hf2-native-bounded-dialogue-reasoning.patch \
            0004-hf2-proof-provenance-ambiguity-runtime-gate.patch \
            0005-hf2-native-resolution-state-audit.patch \
            0006-hf2-speech-act-consequence-learning.patch \
            0007-hf2-owner-resolution-calibration.patch \
            0008-hf2-calibration-execution-boundary.patch \
            0009-hf2-native-resolution-content.patch \
            0010-hf2-native-resolution-transport-receipt.patch \
            0011-hf2-typed-current-turn-alternative-content.patch \
            0012-hf2-act-neutral-alternative-resolution.patch \
            0013-hf2-local-noncontent-execution-receipt.patch \
            0014-hf2-same-db-restart-recovery.patch \
            0015-hf2-native-audio-transport-receipt.patch \
            0016-hf2-resolution-native-audio-presentation.patch
          do
            echo "CHECK $p"
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            git diff --check
            echo "APPLIED $p"
          done
          git diff --stat | tee "$GITHUB_WORKSPACE/hf2-patch-chain-diffstat.txt"
          git add .
          git commit -qm "verified exact post-0016 runtime"

      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check -e "$FIX[dev]"

      - name: Verify published post0016 baseline
        env:
          PYTHONPATH: ${{ env.FIX }}/src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp hf1-exact-identity-evidence.json hf2-patch-chain-diffstat.txt evidence/
          python -m pytest -q \
            tests/test_v082_hf2_*.py \
            tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d \
            tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h \
            tests/hf2_m4c3i tests/hf2_m4c3j \
            --junitxml=evidence/m4c3k-baseline.xml | tee evidence/m4c3k-baseline.txt

      - name: Run focused M4C3K hard-exit presentation tests
        env:
          PYTHONPATH: ${{ env.FIX }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3k-focused-api-test-only.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/hf2_m4c3k \
            --junitxml=evidence/m4c3k-focused.xml | tee evidence/m4c3k-focused.txt

      - name: Run complete HF2 suite plus M4C3K
        env:
          PYTHONPATH: ${{ env.FIX }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3k-complete-api-test-only.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v082_hf2_*.py \
            tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d \
            tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h \
            tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k \
            --junitxml=evidence/m4c3k-complete.xml | tee evidence/m4c3k-complete.txt

      - name: Reconstruct separate fresh exact-HF1 replay
        shell: bash
        run: |
          set -euo pipefail
          REPLAY="$RUNNER_TEMP/ygg-hf1-m4c3k-fresh-replay"
          echo "REPLAY=$REPLAY" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py \
            --extract-dir "$REPLAY" --extract-all \
            --evidence evidence/m4c3k-replay-hf1-identity.json
          for f in conversation_premises.py conversation_bridge.py conversation_reasoning.py conversation_proof.py conversation_runtime_gate.py conversation_actions.py conversation_resolution.py; do
            cp "src/noeron/$f" "$REPLAY/src/noeron/$f"
          done
          cd "$REPLAY"
          git init -q
          for p in \
            0001-hf2-inference-core.patch \
            0002-hf2-current-turn-runtime-bridge.patch \
            0003-hf2-native-bounded-dialogue-reasoning.patch \
            0004-hf2-proof-provenance-ambiguity-runtime-gate.patch \
            0005-hf2-native-resolution-state-audit.patch \
            0006-hf2-speech-act-consequence-learning.patch \
            0007-hf2-owner-resolution-calibration.patch \
            0008-hf2-calibration-execution-boundary.patch \
            0009-hf2-native-resolution-content.patch \
            0010-hf2-native-resolution-transport-receipt.patch \
            0011-hf2-typed-current-turn-alternative-content.patch \
            0012-hf2-act-neutral-alternative-resolution.patch \
            0013-hf2-local-noncontent-execution-receipt.patch \
            0014-hf2-same-db-restart-recovery.patch \
            0015-hf2-native-audio-transport-receipt.patch \
            0016-hf2-resolution-native-audio-presentation.patch
          do
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            echo "APPLIED $p"
          done
          python -m compileall -q src/noeron
          diff -qr --exclude=__pycache__ "$FIX/src/noeron" "$REPLAY/src/noeron"

      - name: Run M4C3K focused and complete suite on fresh replay
        env:
          PYTHONPATH: ${{ env.REPLAY }}/src
          NOERON_DB_PATH: ${{ runner.temp }}/m4c3k-replay-api-test-only.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/hf2_m4c3k \
            --junitxml=evidence/m4c3k-replay-focused.xml | tee evidence/m4c3k-replay-focused.txt
          python -m pytest -q \
            tests/test_v082_hf2_*.py \
            tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d \
            tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h \
            tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k \
            --junitxml=evidence/m4c3k-replay-complete.xml | tee evidence/m4c3k-replay-complete.txt

      - name: Preserve verification evidence and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=__pycache__ -czf evidence/m4c3k-exact-post0016-source.tar.gz -C "$REPLAY" src/noeron
          tar -czf evidence/m4c3k-carrier-evidence.tar.gz \
            patches/hf2 src/noeron/conversation_*.py tests/test_v082_hf2_*.py \
            tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d \
            tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h \
            tests/hf2_m4c3i tests/hf2_m4c3j tests/hf2_m4c3k \
            scripts/verify_hf1_exact_fixture.py .github/workflows/hf2-milestone4c3k.yml
          (cd "$FIX" && find src/noeron -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum) > evidence/m4c3k-post0016-source-sha256.txt
          (cd "$REPLAY" && find src/noeron -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum) > evidence/m4c3k-replay-source-sha256.txt
          diff -u evidence/m4c3k-post0016-source-sha256.txt evidence/m4c3k-replay-source-sha256.txt
          {
            echo "gate=M4C3K post-receipt presentation crash/restart verification over published exact HF1 chain 0001-0016"
            echo "source_commit=$GITHUB_SHA"
            echo "base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29"
            echo "patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014,0015,0016"
            echo "verification_only=true"
            echo "ordinary_0017_published=false"
            echo "certification_claim=false"
            echo "live_runtime_touched=false"
            echo "canonical_db_touched=false"
            echo "hard_exit_subprocess_tests=true"
            echo "receipt_before_presentation_restart_no_replay=true"
            echo "voice_before_artifact_restart_no_fabricated_presentation=true"
            echo "artifact_before_presentation_restart_no_promotion=true"
            echo "presentation_before_fetch_restart_no_duplicate=true"
            echo "speech_act_learning_at_most_once=true"
            echo "audio_fetch_after_restart_transport_only=true"
            echo "playback_confirmed=false"
            echo "peer_delivery_confirmed=false"
            echo "peer_heard_confirmed=false"
            echo "peer_understanding_confirmed=false"
            echo "peer_reply_causation_confirmed=false"
            echo "restart_choice_authority=false"
            echo "restart_preference_authority=false"
            echo "restart_relationship_authority=false"
            sha256sum evidence/m4c3k-exact-post0016-source.tar.gz evidence/m4c3k-carrier-evidence.tar.gz
          } | tee evidence/m4c3k-boundary.txt

      - name: Upload M4C3K verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf2-m4c3k-post-receipt-presentation-crash-verification
          path: evidence/
          if-no-files-found: error

      - name: Publish green M4C3K verification receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/_ci
          SOURCE_SHA="$(sha256sum evidence/m4c3k-exact-post0016-source.tar.gz | awk '{print $1}')"
          CARRIER_SHA="$(sha256sum evidence/m4c3k-carrier-evidence.tar.gz | awk '{print $1}')"
          BASELINE_SUMMARY="$(tail -n 1 evidence/m4c3k-baseline.txt)"
          FOCUSED_SUMMARY="$(tail -n 1 evidence/m4c3k-focused.txt)"
          COMPLETE_SUMMARY="$(tail -n 1 evidence/m4c3k-complete.txt)"
          REPLAY_FOCUSED_SUMMARY="$(tail -n 1 evidence/m4c3k-replay-focused.txt)"
          REPLAY_COMPLETE_SUMMARY="$(tail -n 1 evidence/m4c3k-replay-complete.txt)"
          cat > docs/evidence/_ci/HF2_M4C3K_VERIFICATION_RESULT.txt <<EOF
          milestone=M4C3K
          status=GREEN
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow_ref=$GITHUB_WORKFLOW_REF
          source_commit=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          job_name=exact-baseline-verification-replay
          base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29
          patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014,0015,0016
          verification_only=true
          ordinary_0017_published=false
          source_archive_sha256=$SOURCE_SHA
          carrier_archive_sha256=$CARRIER_SHA
          baseline_summary=$BASELINE_SUMMARY
          focused_summary=$FOCUSED_SUMMARY
          complete_summary=$COMPLETE_SUMMARY
          replay_focused_summary=$REPLAY_FOCUSED_SUMMARY
          replay_complete_summary=$REPLAY_COMPLETE_SUMMARY
          source_byte_parity=true
          certification_claim=false
          live_runtime_touched=false
          canonical_db_touched=false
          EOF
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add docs/evidence/_ci/HF2_M4C3K_VERIFICATION_RESULT.txt
          git commit -m "ci: record green M4C3K presentation-crash verification [skip ci]"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
