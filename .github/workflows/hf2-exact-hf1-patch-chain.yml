name: HF2 Exact HF1 Patch Chain

on:
  workflow_dispatch:
  push:
    branches:
      - stage8B/v0.8.2-conversation-completion-hf2
    paths:
      - 'fixtures/hf1_exact/**'
      - 'patches/hf2/0001-hf2-inference-core.patch'
      - 'patches/hf2/0002-hf2-current-turn-runtime-bridge.patch'
      - 'patches/hf2/0003-hf2-native-bounded-dialogue-reasoning.patch'
      - 'patches/hf2/0004-hf2-proof-provenance-ambiguity-runtime-gate.patch'
      - 'patches/hf2/0005-hf2-native-resolution-state-audit.patch'
      - 'patches/hf2/0006-hf2-speech-act-consequence-learning.patch'
      - 'patches/hf2/0007-hf2-owner-resolution-calibration.patch'
      - 'patches/hf2/0008-hf2-calibration-execution-boundary.patch'
      - 'patches/hf2/0009-hf2-native-resolution-content.patch'
      - 'patches/hf2/0010-hf2-native-resolution-transport-receipt.patch'
      - 'patches/hf2/0011-hf2-typed-current-turn-alternative-content.patch'
      - 'patches/hf2/0012-hf2-act-neutral-alternative-resolution.patch'
      - 'patches/hf2/0013-hf2-local-noncontent-execution-receipt.patch'
      - 'patches/hf2/0014-hf2-same-db-restart-recovery.patch'
      - 'patches/hf2/0015-hf2-native-audio-transport-receipt.patch'
      - 'patches/hf2/0016-hf2-resolution-native-audio-presentation.patch'
      - 'src/noeron/conversation_*.py'
      - 'tests/test_v082_hf2_*.py'
      - 'tests/hf2_m4c3a/**'
      - 'tests/hf2_m4c3b/**'
      - 'tests/hf2_m4c3c/**'
      - 'tests/hf2_m4c3d/**'
      - 'tests/hf2_m4c3e/**'
      - 'tests/hf2_m4c3f/**'
      - 'tests/hf2_m4c3g/**'
      - 'tests/hf2_m4c3h/**'
      - 'tests/hf2_m4c3i/**'
      - 'tests/hf2_m4c3j/**'
      - 'scripts/verify_hf1_exact_fixture.py'
      - '.github/workflows/hf2-exact-hf1-patch-chain.yml'

permissions:
  contents: write

jobs:
  exact-hf1-patch-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOERON_DB_PATH: ./hf2-chain-api-test-only.sqlite3
      NOERON_AUTONOMY_ENABLED: 'false'
      NOERON_TERRA_ENABLED: 'false'
      NOERON_LLM_BACKEND: mock
      NOERON_OWNER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct byte-exact HF1 fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/ygg-hf1-exact"
          echo "FIX=$FIX" >> "$GITHUB_ENV"
          python scripts/verify_hf1_exact_fixture.py \
            --extract-dir "$FIX" \
            --extract-all \
            --evidence hf1-exact-identity-evidence.json

      - name: Add HF2 carrier-only helper modules
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            conversation_premises.py \
            conversation_bridge.py \
            conversation_reasoning.py \
            conversation_proof.py \
            conversation_runtime_gate.py \
            conversation_actions.py \
            conversation_resolution.py
          do
            cp "src/noeron/$f" "$FIX/src/noeron/$f"
          done

      - name: Apply 0001 through 0016 sequentially
        shell: bash
        run: |
          set -euo pipefail
          cd "$FIX"
          git init -q
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add .
          git commit -qm "byte-exact HF1 fixture plus carrier helpers"
          for p in \
            0001-hf2-inference-core.patch \
            0002-hf2-current-turn-runtime-bridge.patch \
            0003-hf2-native-bounded-dialogue-reasoning.patch \
            0004-hf2-proof-provenance-ambiguity-runtime-gate.patch \
            0005-hf2-native-resolution-state-audit.patch \
            0006-hf2-speech-act-consequence-learning.patch \
            0007-hf2-owner-resolution-calibration.patch \
            0008-hf2-calibration-execution-boundary.patch \
            0009-hf2-native-resolution-content.patch \
            0010-hf2-native-resolution-transport-receipt.patch \
            0011-hf2-typed-current-turn-alternative-content.patch \
            0012-hf2-act-neutral-alternative-resolution.patch \
            0013-hf2-local-noncontent-execution-receipt.patch \
            0014-hf2-same-db-restart-recovery.patch \
            0015-hf2-native-audio-transport-receipt.patch \
            0016-hf2-resolution-native-audio-presentation.patch
          do
            echo "CHECK $p"
            git apply --check "$GITHUB_WORKSPACE/patches/hf2/$p"
            git apply "$GITHUB_WORKSPACE/patches/hf2/$p"
            git diff --check
            echo "APPLIED $p"
          done
          git diff --stat | tee "$GITHUB_WORKSPACE/hf2-patch-chain-diffstat.txt"

      - name: Compile patched runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            "$FIX/src/noeron/inference.py" \
            "$FIX/src/noeron/models.py" \
            "$FIX/src/noeron/orchestrator.py" \
            "$FIX/src/noeron/memory.py" \
            "$FIX/src/noeron/room.py" \
            "$FIX/src/noeron/room_models.py" \
            "$FIX/src/noeron/api.py" \
            "$FIX/src/noeron/math/models.py" \
            "$FIX/src/noeron/reasoning.py" \
            "$FIX/src/noeron/math/kernel.py" \
            "$FIX/src/noeron/cognition/models.py" \
            "$FIX/src/noeron/conversation_premises.py" \
            "$FIX/src/noeron/conversation_bridge.py" \
            "$FIX/src/noeron/conversation_reasoning.py" \
            "$FIX/src/noeron/conversation_proof.py" \
            "$FIX/src/noeron/conversation_runtime_gate.py" \
            "$FIX/src/noeron/conversation_actions.py" \
            "$FIX/src/noeron/conversation_resolution.py" \
            "$FIX/src/noeron/development.py"

      - name: Install exact-HF1 runtime dependencies
        run: python -m pip install --disable-pip-version-check -e "$FIX[dev]"

      - name: Run complete HF2 test set against patched HF1 tree
        shell: bash
        env:
          PYTHONPATH: ${{ env.FIX }}/src
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_v082_hf2_*.py tests/hf2_m4c3a tests/hf2_m4c3b tests/hf2_m4c3c tests/hf2_m4c3d tests/hf2_m4c3e tests/hf2_m4c3f tests/hf2_m4c3g tests/hf2_m4c3h tests/hf2_m4c3i tests/hf2_m4c3j \
            --junitxml=hf2-patched-runtime-tests.xml \
            | tee hf2-patched-runtime-tests.txt

      - name: Record patched runtime hashes and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "gate=HF2 exact HF1 patch chain 0001-0016"
            echo "certification_claim=false"
            echo "live_runtime_touched=false"
            echo "canonical_db_touched=false"
            echo "base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29"
            echo "patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014,0015,0016"
            sha256sum patches/hf2/0010-hf2-native-resolution-transport-receipt.patch \
              patches/hf2/0011-hf2-typed-current-turn-alternative-content.patch \
              patches/hf2/0012-hf2-act-neutral-alternative-resolution.patch \
              patches/hf2/0013-hf2-local-noncontent-execution-receipt.patch \
              patches/hf2/0014-hf2-same-db-restart-recovery.patch \
              patches/hf2/0015-hf2-native-audio-transport-receipt.patch \
              patches/hf2/0016-hf2-resolution-native-audio-presentation.patch
            sha256sum \
              "$FIX/src/noeron/inference.py" \
              "$FIX/src/noeron/models.py" \
              "$FIX/src/noeron/orchestrator.py" \
            "$FIX/src/noeron/memory.py" \
            "$FIX/src/noeron/room.py" \
            "$FIX/src/noeron/room_models.py" \
              "$FIX/src/noeron/api.py" \
              "$FIX/src/noeron/math/models.py" \
              "$FIX/src/noeron/reasoning.py" \
              "$FIX/src/noeron/math/kernel.py" \
              "$FIX/src/noeron/cognition/models.py" \
              "$FIX/src/noeron/conversation_actions.py" \
              "$FIX/src/noeron/conversation_resolution.py" \
              "$FIX/src/noeron/development.py" \
              "$FIX/src/noeron/english_egress.py"
          } | tee hf2-exact-hf1-patch-chain-evidence.txt

      - name: Upload patch-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: hf2-exact-hf1-patch-chain-evidence
          path: |
            hf1-exact-identity-evidence.json
            hf2-patch-chain-diffstat.txt
            hf2-patched-runtime-tests.txt
            hf2-patched-runtime-tests.xml
            hf2-exact-hf1-patch-chain-evidence.txt
          if-no-files-found: error

      - name: Publish green exact-chain CI receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/_ci
          PATCH_SHA="$(sha256sum patches/hf2/0016-hf2-resolution-native-audio-presentation.patch | awk '{print $1}')"
          TEST_SUMMARY="$(tail -n 1 hf2-patched-runtime-tests.txt)"
          cat > docs/evidence/_ci/HF2_EXACT_CHAIN_0016_RESULT.txt <<EOF
          milestone=M4C3J-published-chain
          status=GREEN
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          workflow_ref=$GITHUB_WORKFLOW_REF
          source_commit=$GITHUB_SHA
          source_branch=$GITHUB_REF_NAME
          job_name=exact-hf1-patch-chain
          base_zip_sha256=79d04505988c6ed6a694e952d8fce4bd9265d1214a96baf490bb6280ecb08c29
          patch_chain=0001,0002,0003,0004,0005,0006,0007,0008,0009,0010,0011,0012,0013,0014
          patch0015_sha256=$PATCH_SHA
          test_summary=$TEST_SUMMARY
          certification_claim=false
          live_runtime_touched=false
          canonical_db_touched=false
          ordinary_0016_published=true
          EOF
          git config user.name "Yggdrasil HF2 CI"
          git config user.email "hf2-ci@example.invalid"
          git add docs/evidence/_ci/HF2_EXACT_CHAIN_0016_RESULT.txt
          git commit -m "ci: record green HF2 exact chain through 0016 [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
